<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body>
<script>
  // Notify the plugin that the bridge is ready
  window.parent.postMessage({ type: 'agentforce-bridge-ready' }, '*');

  // Receives { type, id, path, body, token, instanceUrl } from the plugin via postMessage.
  // Makes the Salesforce API call from this HTTPS origin (which can be added to Salesforce CORS)
  // and returns the result. The token is the user's OAuth bearer token passed by the plugin.
  window.addEventListener('message', async function(event) {
    var msg = event.data || {};
    if (msg.type !== 'agentforce-request') return;

    var url = msg.instanceUrl + msg.path;

    try {
      var resp = await fetch(url, {
        method: 'POST',
        headers: {
          'Authorization': 'Bearer ' + msg.token,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(msg.body)
      });

      if (!resp.ok) {
        var txt = await resp.text().catch(function() { return String(resp.status); });
        event.source.postMessage({ type: 'agentforce-response', id: msg.id, error: txt }, '*');
        return;
      }

      var data = await resp.json();
      event.source.postMessage({ type: 'agentforce-response', id: msg.id, data: data }, '*');
    } catch(e) {
      event.source.postMessage({ type: 'agentforce-response', id: msg.id, error: e.message }, '*');
    }
  });
</script>
</body>
</html>
